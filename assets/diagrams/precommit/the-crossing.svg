<?xml version="1.0" encoding="UTF-8"?>
<svg class="diagram" viewBox="0 0 1152 800" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="the-crossing-title the-crossing-desc">
  <title id="the-crossing-title">The commit that crosses the mount</title>
  <desc id="the-crossing-desc">Sequence diagram of a commit in a workbench project: git runs the shim git_hooks installed in .git/hooks, which calls .githooks/mix on the host; that script reaches the app container with docker compose exec, where mix git_hooks.run executes the project's .githooks/pre-commit — the formatter first, then each cartridge's block, the first failure cutting the rest — and the non-zero status walks back across the mount to abort the commit. The alternative branch is the library's own example, a mix command run on the host: it finds no Elixir there and cannot cd into the container's path, so the arrow never leaves the host.</desc>
