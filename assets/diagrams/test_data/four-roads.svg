<text x="148.0" y="410.0" fill="var(--ink)" font-size="13" font-family="var(--f-display)" text-anchor="middle" font-weight="600" letter-spacing="0.04em">seed_generator</text>
<text x="148.0" y="424.0" fill="var(--muted)" font-size="9" font-family="var(--f-code)" text-anchor="middle">Ash.Seed · for one state</text>
<rect x="688" y="304" width="200" height="136" rx="6" fill="var(--paper)"/>
<rect x="688" y="304" width="200" height="136" rx="6" fill="var(--ink-05)" stroke="var(--muted)" stroke-width="1"/>
<text x="788.0" y="370.0" fill="var(--ink)" font-size="13" font-family="var(--f-display)" text-anchor="middle" font-weight="600" letter-spacing="0.04em">data layer</text>
<text x="788.0" y="384.0" fill="var(--muted)" font-size="9" font-family="var(--f-code)" text-anchor="middle">ash_postgres · ETS</text>
<text x="788.0" y="396.0" fill="var(--muted)" font-size="9" font-family="var(--f-code)" text-anchor="middle">the database's constraints</text>
<text x="480" y="504" fill="var(--muted)" font-size="13" font-family="var(--f-text)" text-anchor="middle" font-style="italic">On Ecto the box's road skips the changeset, so its test inserts every factory and lets the database refuse by name.</text>
<text x="480" y="524" fill="var(--muted)" font-size="13" font-family="var(--f-text)" text-anchor="middle" font-style="italic">On Ash its road is the action itself: the rules check every record the generator makes.</text>
<line x1="24" y1="544" x2="936" y2="544" stroke="var(--ink-12)" stroke-width="0.8"/>
<text x="24" y="560" fill="var(--muted)" font-size="8" font-family="var(--f-code)" text-anchor="start" letter-spacing="0.14em">LEGEND</text>
<rect x="96" y="552" width="16" height="10" rx="2" fill="var(--accent-tint)" stroke="var(--accent)" stroke-width="0.8"/>
