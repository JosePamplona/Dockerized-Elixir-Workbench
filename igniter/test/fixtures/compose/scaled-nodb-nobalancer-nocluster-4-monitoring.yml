# The workspace's scaled deployment, baked by the workbench:
#
#   docker-compose.scaled.yml  (scaled) - 'up --deploy scaled'
#
# The dev and prod files, docker-compose.yml and docker-compose.prod.yml,
# keep the pod pattern this one deliberately replaces with a bridge
# network. It is baked with as many replicas as --replicas asks for, and
# without the balancer when --no-balancer is given; 'up --deploy scaled'
# writes it again each time.

name: lorem_ipsum

# Scaled deployment: the production replicas live on a regular bridge
# network — one IP each — all answering to the `app` network alias, so
# Docker's embedded DNS returns every address for that single name. That
# is exactly what DNSCluster queries through DNS_CLUSTER_QUERY, and how
# the replicas find each other.
#
# This file deliberately drops the pod pattern of docker-compose.yml.
# Replicas sharing a network namespace would share one IP and one port:
# only the first would bind the server, and every RELEASE_NODE would
# resolve to the same <name>@<ip>, a duplicate node name epmd rejects.
# The price of leaving the pod is that the database is no longer on
# localhost, hence the DATABASE_URL the app anchor overrides in projects
# that have one.
#
# The replicas form a BEAM cluster only with the clustering feature
# ('wb.sh add clustering'): its rel/env.sh.eex is what makes the release
# boot as a named distributed node. Without it they run isolated, which is
# a valid deployment on its own, and DNS_CLUSTER_QUERY is left out.

x-app: &app
  image: lorem-ipsum:0.1.0-prod
  build:
    context: .
    dockerfile: Dockerfile
  env_file:
    - ./.env
  environment:
    # Overrides what .env declares: the pod's localhost database is gone,
    # and the name every replica answers to is the shared network alias.
    # Where the dashboards go on start (config/runtime.exs): Grafana by
    # its name here, where the pod had it on localhost.
    GRAFANA_HOST: http://grafana:3000
  networks:
    default:
      aliases:
        - app
  depends_on:
    grafana:
      condition: service_healthy

services:
  app1:
    <<: *app
    ports:
      - 4000:4000

  app2:
    <<: *app
    ports:
      - 4001:4000

  app3:
    <<: *app
    ports:
      - 4002:4000

  app4:
    <<: *app
    ports:
      - 4003:4000

  # Prometheus, with the monitoring cartridge in, as in the dev compose:
  # the project's monitoring/prometheus.yml, and the targets of its job
  # written here for this topology — one line per replica, by name, so
  # each one is an instance of its own on the dashboards.
  prometheus:
    image: prom/prometheus:latest
    configs:
      - source: prometheus_conf
        target: /etc/prometheus/prometheus.yml
      - source: prometheus_targets
        target: /etc/prometheus/targets.yml

  # Grafana, on the Prometheus above, as in the dev compose; published
  # on its own port, since nothing else here is on the host's side.
  grafana:
    image: grafana/grafana:latest
    ports:
      - 3000:3000
    environment:
      GF_SERVER_HTTP_PORT: 3000
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      # Where the datasource file points: Prometheus, by its name.
      PROMETHEUS_URL: http://prometheus:9090
    depends_on:
      - prometheus
    healthcheck:
      test: wget -q --spider http://localhost:3000/api/health
      interval: 10s
      timeout: 5s
      # The first start on a fresh volume runs Grafana's migrations —
      # eight hundred of them — and a failure in this period does not
      # count: four and a half minutes on a busy host, beside the app
      # compiling (seen 2026-09-08, twice), where thirty seconds gave up
      # on it. The retries after it are five minutes more.
      retries: 30
      start_period: 300s
    configs:
      - source: grafana_datasource
        target: /etc/grafana/provisioning/datasources/datasource.yml

configs:
  # Prometheus's configuration, the project's own, and the targets of
  # its job for this topology: every replica, by its service name.
  prometheus_conf:
    file: ./monitoring/prometheus.yml
  prometheus_targets:
    content: |
      - targets:
          - app1:4000
          - app2:4000
          - app3:4000
          - app4:4000
  # The datasource Grafana provisions at start, the project's own;
  # PROMETHEUS_URL above fills it.
  grafana_datasource:
    file: ./monitoring/grafana/datasource.yml
