# config.conf
# Edit this file to configure the script behaviour.

# Directory where the project is generated and mounted as the container
# volume (wb.sh only). Relative paths resolve from the workbench directory.
export WORKSPACE_PATH="./_workspaces/test_50"

# --- Project creation configuration. ------------------------------------------
# Read by the creation command ('new'): the name and the stack the
# images are built from. Everything else about the Elixir project
# arrives afterwards, as cartridges ('./wb.sh add').

# The project's name: the app and module derive from it, and so do the
# workspace's images and its compose project.
export PROJECT_NAME="Lorem Ipsum"

# Technologies stack versions: the three parts of one hexpm/elixir image
# tag (ELIXIR-erlang-ERLANG-debian-DEBIAN). The usable list lives on
# Docker Hub, not here: './wb.sh stacks' shows the recent ones and
# './wb.sh stacks use TAG' writes the choice below.
# https://hub.docker.com/r/hexpm/elixir/tags
export ELIXIR_VERSION="1.19.2"
export ERLANG_VERSION="28.1"
export DEBIAN_VERSION="trixie-20251103-slim"

# There is no Phoenix installer setting: 'new' takes the newest phx_new
# on hex (or the one './wb.sh new --phx-new VERSION' names) and stamps
# it into the workspace's own Dockerfile.local. It is the generator the
# base cartridges take their delta with, so it belongs to the project
# that was generated with it, not to a default shared by every workspace.

# --- Git ----------------------------------------------------------------------
# Who signs the commits the workbench makes in the workspace: the first
# one after 'new', one per 'add' (so 'eject' can revert it alone), and
# the revert. 'user' takes the host's git identity when git is there and
# has one, and falls back to the workbench's own; 'workbench' always
# signs as "Dockerized Elixir Workbench <wb.sh@localhost>".
export GIT_IDENTITY="user"

# --- Service images. -----------------------------------------------------------
# -- Services stack versions ---------------------------------------------------
# Available versions: https://hub.docker.com/_/postgres/tags
export POSTGRES_IMAGE_VERSION="latest"
# Available versions: https://hub.docker.com/r/dpage/pgadmin4/tags
export PGADMIN_IMAGE_VERSION="latest"
# Load balancer of the scaled deployment ('up --deploy scaled').
# Available versions: https://hub.docker.com/_/nginx/tags
export NGINX_IMAGE_VERSION="alpine"

# There is no ports configuration: each workspace gets the first available
# host ports at creation, baked into its own docker-compose.yml — edit that
# file to change them. Several workspaces can run simultaneously.

# There is no feature configuration either: features are cartridges,
# inserted on the created project one commit each ('./wb.sh add NAME';
# './wb.sh add chiefs_setup' inserts the workbench's own picks) and
# listed by './wb.sh catalog'.
