# config.conf
# Edit this file to configure the script behaviour.

# Directory where the project is generated and mounted as the container
# volume (wb.sh only). Relative paths resolve from the workbench directory.
export WORKSPACE_PATH="./_workspaces/_007"

# The name the next project gets: the app and module derive from it, and
# so do the workspace's images and its compose project. With the line
# above it, this is the identity of the project to come — where it goes,
# and what it is called.
#
# It is a setting, not a record, the way PHX_NEW_VERSION below is: a
# workspace that has a project is named by that project, off its compose
# or its mix.exs, and every command but the creating ones reads it from
# there. './wb.sh new --name "My App"' names one project without
# touching this, and the console's New Project card offers this value
# and takes any other.
#
# The console needs it before there is a project: it mounts the build
# volumes the compose will own, '<project>_build' and '<project>_deps',
# so that mix and git run in its own process. Started for a name that
# the project then does not get, it says so and offers to start again
# (2026-09-27).
export PROJECT_NAME="Lorem Ipsum Max"

# --- Workbench images. --------------------------------------------------------
# What the workbench itself runs on: the four below name its image,
# 'dew-exELIXIR-erlOTP-phxVERSION:WORKBENCH', and build it. Every command
# runs there — generation, cartridges, git, the catalog, the console —
# and a project's own dev image is built from the same stack. Everything
# else about the Elixir project arrives afterwards, as cartridges
# ('./wb.sh add').

# Technologies stack versions: the three parts of one hexpm/elixir image
# tag (ELIXIR-erlang-ERLANG-debian-DEBIAN). The usable list lives on
# Docker Hub, not here: './wb.sh stacks' shows the recent ones and
# './wb.sh stacks use TAG' writes the choice below.
# https://hub.docker.com/r/hexpm/elixir/tags
export ELIXIR_VERSION="1.20.4"
export ERLANG_VERSION="29.1.1"
export DEBIAN_VERSION="trixie-20260918-slim"

# The Phoenix installer 'new' generates with. Empty — the ordinary case
# — and hex decides: the newest phx_new release that runs on the stack
# above, said out loud when that is not hex's very newest. Set it for a
# standing choice (a release to avoid, a team standard), and the flag
# './wb.sh new --phx-new VERSION' overrides it for one run. A version
# hex does not have is refused before anything is built.
#
# This is the choice, not the record. Whatever 'new' resolves is stamped
# into the workspace's own Dockerfile.local (ARG PHX_NEW) and read back
# from there ever after, because it is the generator the base cartridges
# take their delta with: it belongs to the project generated with it,
# and two workspaces created months apart keep their own. Nothing is
# written back here — this line says what the next project gets, never
# what an existing one got.
export PHX_NEW_VERSION="1.8.15"

# --- Git ----------------------------------------------------------------------
# Who signs the commits the workbench makes in the workspace: the first
# one after 'new', one per 'add' (so 'eject' can revert it alone), and
# the revert. 'user' takes the host's git identity when git is there and
# has one, and falls back to the workbench's own; 'workbench' always
# signs as "Dockerized Elixir Workbench <wb.sh@localhost>".
export GIT_IDENTITY="workbench"

# --- Jobs ---------------------------------------------------------------------
# The CPU priority of what compiles — 'new', 'add', 'expand', and the
# console's resident when a cartridge changed the dependencies — as a
# Linux niceness, 0 to 19. 10 cedes the CPU to the browser and the
# console while a job compiles: the compiler still takes every idle
# core, and gives way the moment something else asks. 0 compiles at
# full priority and drags everything else along with it. The readers
# (status, git) are never niced: they are short and the console waits
# on them.
export JOB_NICENESS="10"

# --- Service images. -----------------------------------------------------------
# -- Services stack versions ---------------------------------------------------
# Available versions: https://hub.docker.com/_/postgres/tags
export POSTGRES_IMAGE_VERSION="latest"
# The other servers the ecto cartridge can run on ('add ecto --database mysql|mssql').
# Available versions: https://hub.docker.com/_/mysql/tags
export MYSQL_IMAGE_VERSION="latest"
# Available versions: https://mcr.microsoft.com/en-us/artifact/mar/mssql/server/tags
# (amd64 only; ACCEPT_EULA is set by the compose: running it accepts Microsoft's licence.)
export MSSQL_IMAGE_VERSION="latest"
# Available versions: https://hub.docker.com/r/dpage/pgadmin4/tags
export PGADMIN_IMAGE_VERSION="latest"
# Adminer of the adminer cartridge: the major its login file is written for.
# Available versions: https://hub.docker.com/_/adminer/tags
export ADMINER_IMAGE_VERSION="6"
# Load balancer of the scaled deployment ('up --deploy scaled').
# Available versions: https://hub.docker.com/_/nginx/tags
export NGINX_IMAGE_VERSION="alpine"
# Load tool of the k6 cartridge ('./wb.sh k6').
# Available versions: https://hub.docker.com/r/grafana/k6/tags
export K6_IMAGE_VERSION="latest"
# Metrics and dashboards of the monitoring cartridge.
# Available versions: https://hub.docker.com/r/prom/prometheus/tags
export PROMETHEUS_IMAGE_VERSION="latest"
# Available versions: https://hub.docker.com/r/grafana/grafana/tags
export GRAFANA_IMAGE_VERSION="latest"

# There is no ports configuration: each workspace gets the first available
# host ports at creation, baked into its own docker-compose.yml — edit that
# file to change them. Several workspaces can run simultaneously.

# There is no feature configuration either: features are cartridges,
# inserted on the created project one commit each ('./wb.sh add NAME';
# './wb.sh add chiefs_setup' inserts the workbench's own picks) and
# listed by './wb.sh catalog'.
