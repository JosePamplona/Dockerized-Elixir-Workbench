<rect x="407.0" y="176" width="122" height="12" rx="2" fill="var(--paper)"/><text x="468" y="185" fill="var(--soft)" font-size="8" font-family="var(--f-code)" text-anchor="middle" letter-spacing="0.06em">SKIPS THE CHANGESET</text>
<line x1="248" y1="332" x2="368" y2="332" fill="none" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#arrow-muted)"/>
<line x1="568" y1="332" x2="688" y2="332" fill="none" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#arrow-muted)"/>
