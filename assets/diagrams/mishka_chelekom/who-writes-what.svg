<?xml version="1.0" encoding="UTF-8"?>
<svg class="diagram" viewBox="0 0 960 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="who-writes-what-title who-writes-what-desc">
  <title id="who-writes-what-title">Who writes what, and when</title>
  <desc id="who-writes-what-desc">Sequence diagram of a mishka_chelekom insert: wb.sh runs the cartridge, which checks its guards and hands Igniter a patch set — the dependency, the MCP route, the project's mix task and a .gitignore line — with one queued task; Igniter writes those files, fetches and compiles, and runs the queued task, which completes the list of components off the library's catalog, runs the library's own generator — the components, the import macro, the stylesheet and the hooks — then mends the documentation's fences and formats; the output returns, and wb.sh commits everything as one Insert commit.</desc>
