<rect x="416.0" y="392" width="104" height="12" rx="2" fill="var(--paper)"/><text x="468" y="401" fill="var(--soft)" font-size="8" font-family="var(--f-code)" text-anchor="middle" letter-spacing="0.06em">SKIPS THE ACTION</text>
