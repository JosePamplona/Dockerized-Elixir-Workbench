  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
svg.diagram{
      --paper:#F2EDF3;
      --surface:#FBF8FC;
      --paper-2:#EBE3EE;
      --ink:#1D1424;
      --muted:#6B5C76;
      --soft:#8F819A;
      --rule:#D6CBDA;
      --accent:#9A7A3E;
      --accent-tint:rgba(154,122,62,.12);
      --link:#3F6FA8;

      --f-text:'Source Serif 4',Georgia,serif;
      --f-code:'IBM Plex Mono',ui-monospace,Menlo,monospace;
    }
    @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) svg.diagram, svg.diagram:root{
        --paper:#160F1B;
        --surface:#22182A;
        --paper-2:#2C2036;
        --ink:#EFE7F2;
        --muted:#A394AE;
        --soft:#7E7189;
        --rule:#3B2D46;
        --accent:#D4B27E;
        --accent-tint:rgba(212,178,126,.14);
        --link:#8DBBE8;
        --ink-02:rgba(239,231,242,.02);
        --ink-03:rgba(239,231,242,.03);
        --ink-05:rgba(239,231,242,.05);
        --ink-12:rgba(239,231,242,.12);
        --ink-20:rgba(239,231,242,.20);
        --ink-30:rgba(239,231,242,.30);
        --muted-10:rgba(163,148,174,.10);
        --accent-50:rgba(212,178,126,.50);
      } }
    :root[data-theme="dark"] svg.diagram{
      --paper:#160F1B;
      --surface:#22182A;
      --paper-2:#2C2036;
      --ink:#EFE7F2;
      --muted:#A394AE;
      --soft:#7E7189;
      --rule:#3B2D46;
      --accent:#D4B27E;
      --accent-tint:rgba(212,178,126,.14);
      --link:#8DBBE8;
      --ink-02:rgba(239,231,242,.02);
      --ink-03:rgba(239,231,242,.03);
      --ink-05:rgba(239,231,242,.05);
      --ink-12:rgba(239,231,242,.12);
      --ink-20:rgba(239,231,242,.20);
      --ink-30:rgba(239,231,242,.30);
      --muted-10:rgba(163,148,174,.10);
      --accent-50:rgba(212,178,126,.50);
    }
    
    body { font-family: 'Source Serif 4',Georgia,serif; background: var(--page); color: var(--page-ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    :root { --page: #F2EDF3; --page-ink: #1D1424; --page-muted: #6B5C76; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --page: #160F1B; --page-ink: #EFE7F2; --page-muted: #A394AE; } }
    :root[data-theme="dark"] { --page: #160F1B; --page-ink: #EFE7F2; --page-muted: #A394AE; }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow { font-family: 'IBM Plex Mono',ui-monospace,Menlo,monospace; font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--page-muted); margin-bottom: 0.5rem; }
    h1 { font-family: 'Source Serif 4',Georgia,serif; font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
