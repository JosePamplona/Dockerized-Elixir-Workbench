# The workspace's orchestration, baked by the workbench into two files:
#
#   docker-compose.yml       (dev)  - dev toolchain image, source mounted
#   docker-compose.prod.yml  (prod) - release image, no source volume and
#                                     no build identity args
#
# Both are the pod topology below with another image and two switches:
# the dev file has no one-shot 'migrate' service (the dev image migrates
# itself on boot) and the prod file makes the app wait for it; the prod
# file also carries no source mount and no build identity. The scaled
# deployment, docker-compose.scaled.yml, is another topology: it
# replaces the pod pattern with a bridge network. './wb.sh bake' writes
# this file again for the project as it is now.

name: lorem_ipsum

services:
  # Pod pattern: this service's only job is to own the workspace's network
  # namespace and its published ports — literally the "pause" container
  # Kubernetes uses for the same job in its pods (~700 kB, sleeps forever).
  # Every other service joins it, so they all reach each other through
  # localhost — and the project keeps Phoenix's default database
  # configuration untouched.
  # No `restart:` on any service, here or in the scaled compose: a
  # deployment goes up and down whole, and that holds across a reboot
  # of the host too. With `unless-stopped` on the pod and the database
  # alone, a reboot brought those two back and left the app and pgadmin
  # down — half a deployment, which the status could only call "no
  # deployment is up and these are still here". Now a reboot leaves
  # everything exited, the status says down, and Up raises it whole.
  # What this gives up: a database that crashes is not restarted on its
  # own — the console's events feed says so, and Restart is a click.
  pod:
    image: registry.k8s.io/pause:3.10
    ports:
      # Application port (host:container).
      - 4000:4000
      # pgAdmin port, with db_admin's pgadmin in. The database is not
      # published: it is only reachable from inside this workspace.
      - 5050:5050
      # Grafana port, with the monitoring cartridge in. Prometheus is not
      # published: Grafana reads it from inside this workspace.
      - 3000:3000

  app:
    image: lorem-ipsum:local
    build:
      # Baked by the workbench: Dockerfile.local (the app's dev image)
      # in docker-compose.yml, and the production Dockerfile in
      # docker-compose.prod.yml, baked by 'up --env prod'. Do not point
      # docker-compose.yml at the production Dockerfile. The workbench's
      # own runs (add, mix, git) use an image of their own, not this one.
      dockerfile: Dockerfile.local
      # These arguments are only relevant for 'Dockerfile.local'.
      # Build identity for standalone builds (no workbench): the image is
      # born with the workspace creator's UID/GID, so files written into
      # the mounted source keep the right ownership. Edit if you build
      # this project on a host with a different user.
      args:
        UID: 1000
        GID: 1000
    # The image starts itself (CMD). Defaults per dockerfile —
    #   Dockerfile.local: sh -c 'cd /app/src && mix setup && exec elixir --sname lorem_ipsum -S mix phx.server'
    #   Dockerfile (prod): /app/bin/server
    # Uncomment to override:
    # command:
    # An init (docker's tini) as PID 1 above the command: it reaps what
    # the BEAM's ports leave behind — the esbuild and tailwind watchers
    # of a dev server — and forwards the signals of a stop.
    init: true
    network_mode: "service:pod"
    env_file:
      - ./.env
    volumes:
      - .:/app/src
      # Compiled code and dependencies stay inside Docker, never in the
      # bind mount: a volume covers each of the two directories Mix
      # writes into, where Mix already looks for them — nothing is
      # written through to the host, and nothing has to be told where
      # they went. 'delete' drops them with the project.
      - build:/app/src/_build
      - deps:/app/src/deps
    depends_on:
      database:
        condition: service_healthy
      grafana:
        condition: service_healthy
    healthcheck:
      # TCP-connect probe via bash (present in both the dev toolchain and
      # the prod runner image): no curl/wget needed.
      test: ["CMD", "bash", "-c", "</dev/tcp/localhost/4000"]
      interval: 10s
      timeout: 5s
      retries: 3
      # First compile & boot may take a while: not counted as failures.
      start_period: 120s

  database:
    image: postgres:latest
    network_mode: "service:pod"
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      # Created when the data directory is initialised, and only then:
      # the production database the release deployments migrate into
      # ('bin/migrate' runs the migrations, it does not create the
      # database; 'mix ecto.create' does that for dev on its own). The
      # prod and scaled deployments share this container's volume with
      # dev, so the database has to be there from the first init.
      POSTGRES_DB: lorem_ipsum_prod
    depends_on:
      - pod
    healthcheck:
      # -h forces TCP: without it pg_isready asks the unix socket, which
      # the image's init already answers on its temporary server — so a
      # fresh volume said healthy before the real server listened, and
      # the migrator's first connections were refused.
      test: pg_isready -q -h localhost -d postgres -U postgres
      timeout: 45s
      interval: 10s
      retries: 10
      # Its init is quick, but it is an init: the same allowance, shorter.
      start_period: 30s

  pgadmin:
    image: dpage/pgadmin4:latest
    network_mode: "service:pod"
    # `exec` on the last step, as the app's CMD: without it this shell
    # stayed PID 1 and every stop of pgadmin waited the 10 s of grace
    # and ended in SIGKILL (`die exit 137`, seen on the events feed).
    entrypoint: >
      /bin/sh -c "
      echo 'localhost:5432:*:postgres:postgres' > /var/lib/pgadmin/pgpass;
      chmod 600 /var/lib/pgadmin/pgpass;
      exec /entrypoint.sh
      "
    environment:
      PGADMIN_DEFAULT_EMAIL: pgadmin4@pgadmin.org
      PGADMIN_DEFAULT_PASSWORD: pass
      PGADMIN_LISTEN_PORT: 5050
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    depends_on:
      - database
    configs:
      - source: pgadmin_servers
        target: /pgadmin4/servers.json

  # Prometheus, with the monitoring cartridge in: every few seconds it
  # scrapes the app's /metrics (PromEx.Plug in the endpoint) and keeps
  # what it read. Its configuration is the project's own,
  # monitoring/prometheus.yml; the targets of its one job are this
  # file's, in the targets file below, because they are the topology's
  # — the app on localhost here, one line per replica on the scaled
  # network. Not published: Grafana reads it from inside the pod, and a
  # query is Grafana's Explore.
  prometheus:
    image: prom/prometheus:latest
    network_mode: "service:pod"
    depends_on:
      - pod
    configs:
      - source: prometheus_conf
        target: /etc/prometheus/prometheus.yml
      - source: prometheus_targets
        target: /etc/prometheus/targets.yml

  # Grafana, on the Prometheus above: its datasource is provisioned off
  # the project's monitoring/grafana/datasource.yml, and its dashboards
  # are the ones PromEx uploads when the app starts — which is why the
  # app waits for this container to be healthy. Anonymous, as admin, so
  # the door opens without a sign-in; the credentials the app uploads
  # with are the image's defaults, named here.
  grafana:
    image: grafana/grafana:latest
    network_mode: "service:pod"
    environment:
      GF_SERVER_HTTP_PORT: 3000
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      # Where the datasource file points: Prometheus, in the pod.
      PROMETHEUS_URL: http://localhost:9090
    depends_on:
      - prometheus
    healthcheck:
      # busybox's wget, which the Alpine image carries.
      test: wget -q --spider http://localhost:3000/api/health
      interval: 10s
      timeout: 5s
      # The first start on a fresh volume runs Grafana's migrations —
      # eight hundred of them — and a failure in this period does not
      # count: four and a half minutes on a busy host, beside the app
      # compiling (seen 2026-09-08, twice), where thirty seconds gave up
      # on it. The retries after it are five minutes more.
      retries: 30
      start_period: 300s
    configs:
      - source: grafana_datasource
        target: /etc/grafana/provisioning/datasources/datasource.yml

volumes:
  build:
  deps:

configs:
  # The servers pgAdmin opens with: db_admin's file, the
  # project's own (pgadmin/servers.json), not a copy kept in here.
  pgadmin_servers:
    file: ./pgadmin/servers.json
  # Prometheus's configuration, the project's own (monitoring/
  # prometheus.yml), and the targets of its job — the topology's, so
  # written here: the app, on localhost inside the pod.
  prometheus_conf:
    file: ./monitoring/prometheus.yml
  prometheus_targets:
    content: |
      - targets: ["localhost:4000"]
  # The datasource Grafana provisions at start, the project's own
  # (monitoring/grafana/datasource.yml); PROMETHEUS_URL above fills it.
  grafana_datasource:
    file: ./monitoring/grafana/datasource.yml
