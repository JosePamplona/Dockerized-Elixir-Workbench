<?xml version="1.0" encoding="UTF-8"?>
<svg class="diagram" viewBox="0 0 960 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="scaled-deployment-title scaled-deployment-desc">
  <title id="scaled-deployment-title">The scaled deployment, and what clustering adds inside it</title>
  <desc id="scaled-deployment-desc">Deployment diagram of ./wb.sh up --deploy scaled: a browser reaching an nginx balancer on the host port, four production replicas of the app sharing the alias app on a bridge network, Docker's embedded DNS answering that alias with four addresses, the database reached by name, a one-shot migration, and — the cartridge's addition — the replicas booting as named distributed nodes that find each other.</desc>
