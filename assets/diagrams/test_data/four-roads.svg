<text x="148.0" y="128.0" fill="var(--muted)" font-size="9" font-family="var(--f-code)" text-anchor="middle">user_fixture/1 · the context</text>
<rect x="368" y="88" width="200" height="56" rx="6" fill="var(--paper)"/>
<rect x="368" y="88" width="200" height="56" rx="6" fill="var(--surface)" stroke="var(--ink)" stroke-width="1"/>
<text x="468.0" y="114.0" fill="var(--ink)" font-size="13" font-family="var(--f-display)" text-anchor="middle" font-weight="600" letter-spacing="0.04em">changeset</text>
<text x="468.0" y="128.0" fill="var(--muted)" font-size="9" font-family="var(--f-code)" text-anchor="middle">cast · validate · constraints</text>
<rect x="48" y="168" width="200" height="56" rx="6" fill="var(--paper)"/>
<rect x="48" y="168" width="200" height="56" rx="6" fill="var(--accent-tint)" stroke="var(--accent)" stroke-width="1"/>
<text x="148.0" y="194.0" fill="var(--ink)" font-size="13" font-family="var(--f-display)" text-anchor="middle" font-weight="600" letter-spacing="0.04em">ExMachina factory</text>
<text x="148.0" y="208.0" fill="var(--muted)" font-size="9" font-family="var(--f-code)" text-anchor="middle">insert(:user)</text>
<rect x="688" y="88" width="200" height="136" rx="6" fill="var(--paper)"/>
<rect x="688" y="88" width="200" height="136" rx="6" fill="var(--ink-05)" stroke="var(--muted)" stroke-width="1"/>
<text x="788.0" y="154.0" fill="var(--ink)" font-size="13" font-family="var(--f-display)" text-anchor="middle" font-weight="600" letter-spacing="0.04em">Repo</text>
<text x="788.0" y="168.0" fill="var(--muted)" font-size="9" font-family="var(--f-code)" text-anchor="middle">Repo.insert!</text>
<text x="788.0" y="180.0" fill="var(--muted)" font-size="9" font-family="var(--f-code)" text-anchor="middle">the database's constraints</text>
<rect x="48" y="304" width="200" height="56" rx="6" fill="var(--paper)"/>
<rect x="48" y="304" width="200" height="56" rx="6" fill="var(--accent-tint)" stroke="var(--accent)" stroke-width="1"/>
