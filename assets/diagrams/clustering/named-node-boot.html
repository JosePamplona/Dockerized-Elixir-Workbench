    <h1>How the release becomes a named node, and what DNSCluster does with the name</h1>

  <title id="named-node-boot-title">How the release becomes a named node, and what DNSCluster does with the name</title>
  <desc id="named-node-boot-desc">Sequence diagram of a clustered release booting: the release script sources env.sh, which exports RELEASE_NODE with the container address and RELEASE_DISTRIBUTION=name; the VM starts with that long name; the supervision tree starts DNSCluster with the query from DNS_CLUSTER_QUERY; every five seconds it asks Docker's embedded DNS for the alias, receives one address per replica, and dials basename@address on each peer — or, with the default short name, logs that the node is not running in distributed mode and dials nobody.</desc>
