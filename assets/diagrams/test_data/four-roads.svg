<?xml version="1.0" encoding="UTF-8"?>
<svg class="diagram" viewBox="0 0 960 580" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="four-roads-title four-roads-desc">
  <title id="four-roads-title">The four roads a test record takes to the database</title>
  <desc id="four-roads-desc">Architecture diagram of test data on both lines. On Ecto, a Phoenix fixture goes through the context's changeset to the repo, while an ExMachina factory — what test_data writes — goes straight to Repo.insert! and skips the changeset, leaving the database's constraints as the only check. On Ash, a changeset_generator — what test_data writes — runs the resource's action with its changes, validations and policies before the data layer, while seed_generator writes under the action for a state no action reaches.</desc>
  <defs><style>@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&amp;family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap');
svg{
  --paper:#F2EDF3;
  --surface:#FBF8FC;
  --paper-2:#EBE3EE;
  --ink:#1D1424;
  --muted:#6B5C76;
  --soft:#8F819A;
  --rule:#D6CBDA;
  --accent:#9A7A3E;
  --accent-tint:rgba(154,122,62,.12);
  --link:#3F6FA8;
  --ink-02:rgba(29,20,36,.02);
  --ink-03:rgba(29,20,36,.03);
  --ink-05:rgba(29,20,36,.05);
  --ink-12:rgba(29,20,36,.12);
  --ink-20:rgba(29,20,36,.20);
  --ink-30:rgba(29,20,36,.30);
  --muted-10:rgba(107,92,118,.10);
  --accent-50:rgba(154,122,62,.50);
  --f-display:'Barlow Condensed','Roboto Condensed','Arial Narrow',sans-serif;
  --f-text:'Source Serif 4',Georgia,serif;
  --f-code:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) svg, svg:root{
    --paper:#160F1B;
    --surface:#22182A;
    --paper-2:#2C2036;
    --ink:#EFE7F2;
    --muted:#A394AE;
    --soft:#7E7189;
    --rule:#3B2D46;
    --accent:#D4B27E;
    --accent-tint:rgba(212,178,126,.14);
    --link:#8DBBE8;
    --ink-02:rgba(239,231,242,.02);
    --ink-03:rgba(239,231,242,.03);
    --ink-05:rgba(239,231,242,.05);
    --ink-12:rgba(239,231,242,.12);
    --ink-20:rgba(239,231,242,.20);
    --ink-30:rgba(239,231,242,.30);
    --muted-10:rgba(163,148,174,.10);
    --accent-50:rgba(212,178,126,.50);
  } }
:root[data-theme="dark"] svg{
  --paper:#160F1B;
  --surface:#22182A;
  --paper-2:#2C2036;
  --ink:#EFE7F2;
  --muted:#A394AE;
  --soft:#7E7189;
  --rule:#3B2D46;
  --accent:#D4B27E;
  --accent-tint:rgba(212,178,126,.14);
  --link:#8DBBE8;
  --ink-02:rgba(239,231,242,.02);
  --ink-03:rgba(239,231,242,.03);
  --ink-05:rgba(239,231,242,.05);
  --ink-12:rgba(239,231,242,.12);
  --ink-20:rgba(239,231,242,.20);
  --ink-30:rgba(239,231,242,.30);
  --muted-10:rgba(163,148,174,.10);
  --accent-50:rgba(212,178,126,.50);
}
</style><marker id="arrow-muted" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--muted)"/></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--accent)"/></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--link)"/></marker><marker id="arrow-ink" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--ink)"/></marker></defs>
