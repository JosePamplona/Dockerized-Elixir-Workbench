  --ink-30:rgba(29,20,36,.30);
  --muted-10:rgba(107,92,118,.10);
  --accent-50:rgba(154,122,62,.50);
  --f-display:'Barlow Condensed','Roboto Condensed','Arial Narrow',sans-serif;
  --f-text:'Source Serif 4',Georgia,serif;
  --f-code:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
